[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-proxy"
dynamic = ["version"]
description = "A multi-protocol offline proxy tool for caching network resources"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "yorelog", email = "yorelog@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "aiohttp>=3.8.0",
    "click>=8.1.0",
    "cryptography>=41.0.0",
    "certifi>=2023.7.22",
    "diskcache>=5.6.0",
    "zstandard>=0.21.0",
    "lz4>=4.3.0",
    "asyncio-throttle>=1.0.0",
    "aiofiles>=23.0.0",
    "dulwich>=0.21.0",
    "GitPython>=3.1.0",
    "packaging>=23.0",
    "pip-tools>=7.0.0",
    "pyOpenSSL>=23.0.0",
    "netifaces>=0.11.0",
    "psutil>=5.9.0",
    "sqlalchemy>=2.0.0",
    "tqdm>=4.66.0",
    "colorama>=0.4.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "pre-commit>=3.3.0",
    "bumpversion>=0.6.0",
]

[project.scripts]
offline-proxy = "offline_proxy.cli.main:main"

[project.urls]
Homepage = "https://github.com/yorelog/offline-proxy"
Repository = "https://github.com/yorelog/offline-proxy"
Issues = "https://github.com/yorelog/offline-proxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=offline_proxy",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]

[tool.coverage.run]
source = ["src/offline_proxy"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]